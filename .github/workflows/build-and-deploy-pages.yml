name: Build plugin and deploy to GitHub Pages

# Runs automatically whenever you push to main (e.g. after uploading/editing files on github.com).
# Needs no secrets: building the plugin bundle does not talk to GoodData at all.
#
# NOTE: this project's files live inside the top20_products_gallery/ subfolder of this
# repo (that is where everything was uploaded), so every step below runs with that as its
# working directory, and the Pages artifact path points inside it too.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: top20_products_gallery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build dashboard plugin
        run: npm run build-plugin

      - name: Upload built plugin as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: top20_products_gallery/esm/dashboardPlugin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
